name: StrikeCast verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check packages apps/api ml/research/strikecast/src/ingestion scripts tests
      - run: python -m compileall -q packages apps ml scripts tests
      - run: python scripts/development/validate_configuration.py
      - run: python scripts/development/validate_structure.py
      - run: python scripts/security/audit_repository.py
      - run: python scripts/data/plan_required_era5.py
      - run: python scripts/ml/validate_checkpoint.py
      - run: python scripts/development/smoke_test.py
      - run: python scripts/verification/validate_dataset.py || test $? -eq 2
      - run: python scripts/ml/leakage_audit.py --allow-blocked
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm test
      - working-directory: apps/web
        run: npm audit
      - working-directory: apps/web
        run: npx playwright install chromium
      - working-directory: apps/web
        run: npm run test:e2e
      - working-directory: apps/web
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose/docker-compose.yml config --quiet
      - run: docker compose -f infra/compose/docker-compose.yml build
