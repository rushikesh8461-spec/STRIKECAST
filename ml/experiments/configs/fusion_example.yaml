# Example multimodal config — demonstrates the fusion path with 2 dummy
# modalities. Modality names/channel counts are PLACEHOLDERS until M1/M2
# confirm which modalities are actually available (radar/satellite/
# lightning/NWP). Use this only to verify the fusion architecture runs;
# do not treat "radar"/"satellite" as confirmed final modality names.

data:
  sequence_length: 6
  input_channels: 1          # unused directly by fusion (per-modality channels below matter)
  height: 32
  width: 32
  forecast_horizon: 1
  target_type: binary
  modalities: [radar, satellite]
  modality_channels:
    radar: 1
    satellite: 2

train:
  seed: 42
  batch_size: 4
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 2
  optimizer: adam
  loss: bce
  conv_hidden_dims: [8, 8]
  conv_kernel_size: 3
  checkpoint_dir: checkpoints
  checkpoint_every_n_epochs: 1
  device: cpu
  model_name: fusion_convlstm
  model_version: 0.1.0
